[project]
name = "online-cinema"
version = "0.1.0"
description = "FastAPI backend for an online cinema service."
authors = [{ name = "Online Cinema Team" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115.6,<0.116.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "pydantic-settings>=2.7.1,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "alembic>=1.14.0,<2.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "celery>=5.4.0,<6.0.0",
    "redis>=5.2.1,<6.0.0",
    "boto3>=1.35.90,<2.0.0",
    "stripe>=11.4.1,<12.0.0",
    "python-multipart>=0.0.20,<0.0.21",
    "email-validator>=2.2.0,<3.0.0",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "greenlet (>=3.5.3,<4.0.0)",
    "bcrypt (<5)",
]

[tool.poetry]
packages = [{ include = "app" }]

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-asyncio>=0.25.0,<0.26.0",
    "httpx>=0.28.1,<0.29.0",
    "ruff>=0.8.4,<0.9.0",
    "mypy>=1.14.1,<2.0.0",
    "coverage>=7.6.10,<8.0.0",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "celery-types (>=0.26.0,<0.27.0)",
    "black (>=26.5.1,<27.0.0)",
    "testcontainers (>=4.14.2,<5.0.0)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
plugins = []
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"
