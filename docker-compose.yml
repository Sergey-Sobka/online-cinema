x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Online Cinema}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://online_cinema:online_cinema@db:5432/online_cinema}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-local-env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-no-reply@online-cinema.local}
  ACTIVATION_URL_BASE: ${ACTIVATION_URL_BASE:-http://localhost:8000/api/v1/auth/activate}
  ACTIVATION_TOKEN_TTL_HOURS: ${ACTIVATION_TOKEN_TTL_HOURS:-24}
  PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-http://localhost:8000/api/v1/auth/password/reset}
  PASSWORD_RESET_TOKEN_TTL_HOURS: ${PASSWORD_RESET_TOKEN_TTL_HOURS:-1}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
  MINIO_BUCKET: ${MINIO_BUCKET:-online-cinema}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_change_me}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_change_me}

services:
  api:
    build:
      context: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      <<: *app-env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      - db
      - redis
      - minio
      - mailpit

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-online_cinema}
      POSTGRES_USER: ${POSTGRES_USER:-online_cinema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-online_cinema}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery-worker:
    build:
      context: .
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      <<: *app-env
    volumes:
      - .:/app
    depends_on:
      - redis
      - db

  celery-beat:
    build:
      context: .
    command: celery -A app.worker.celery_app beat --loglevel=info
    environment:
      <<: *app-env
    volumes:
      - .:/app
    depends_on:
      - redis
      - db

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  stripe-cli:
    image: stripe/stripe-cli:latest
    command: listen --forward-to api:8000/api/v1/payments/webhook --api-key ${STRIPE_SECRET_KEY}
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      - api
    restart: always

volumes:
  postgres_data:
  minio_data:
